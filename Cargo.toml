[package]
name = "voice-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Approval-bound calling controller and thin CLI; offline reference implementation"
license = "MIT"

[[bin]]
name = "voice"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"

[dev-dependencies]
hegeltest = "=0.50.3"
tempfile = "3"

[profile.release]
lto = true
strip = true
